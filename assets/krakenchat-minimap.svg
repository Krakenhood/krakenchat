<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- KrakenChat minimap icon (no rim: the minimap button has its own ring; zoomed in to fill it): the Krakenfriends kraken holding up a speech bubble.
       Made to stay readable at minimap size (about 18 px). -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#2aa6a0"/>
    </linearGradient>
    <linearGradient id="arm" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2aa6a0"/><stop offset="1" stop-color="#7c5be0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.45" cy="0.42" r="0.7">
      <stop offset="0" stop-color="#4a4036"/><stop offset="0.65" stop-color="#2a241e"/><stop offset="1" stop-color="#14110e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5d77a"/><stop offset="0.5" stop-color="#c99a2e"/><stop offset="1" stop-color="#7a5714"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#f1dfae"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
  <!-- WoW style: dark stone, a few worn patches -->
  <g fill="#000" fill-opacity=".18">
    <ellipse cx="120" cy="420" rx="120" ry="40"/><ellipse cx="400" cy="300" rx="70" ry="30"/><ellipse cx="300" cy="460" rx="90" ry="26"/>
  </g>
  <!-- the scene, scaled so it fits inside the round minimap mask -->
  <g transform="translate(256 262) scale(0.9) translate(-266 -236)">
  <!-- tentacles below the head -->
  <g fill="none" stroke="url(#arm)" stroke-width="30" stroke-linecap="round">
    <path d="M92 400 C70 440 40 448 36 480"/>
    <path d="M150 420 C146 456 128 476 140 500"/>
    <path d="M214 410 C232 450 262 462 258 494"/>
  </g>
  <!-- the arm holding the bubble: from the head's right side up and over -->
  <path d="M262 330 C330 330 360 300 352 250 C346 214 318 210 316 236" fill="none" stroke="url(#arm)" stroke-width="34" stroke-linecap="round"/>
  <g fill="#c4b5fd" fill-opacity=".6"><circle cx="330" cy="318" r="6"/><circle cx="352" cy="282" r="5"/></g>
  <!-- speech bubble, parchment with a gold rim -->
  <path d="M250 42 H462 Q490 42 490 70 V196 Q490 224 462 224 H352 L318 262 L322 224 H250 Q222 224 222 196 V70 Q222 42 250 42Z"
        fill="url(#bubble)" stroke="#c99a2e" stroke-width="10" stroke-linejoin="round"/>
  <g fill="#2aa6a0"><circle cx="292" cy="133" r="21"/><circle cx="356" cy="133" r="21"/><circle cx="420" cy="133" r="21"/></g>
  <!-- head -->
  <path d="M40 330 C40 214 100 168 168 168 C236 168 296 214 296 330 C296 382 252 412 168 412 C84 412 40 382 40 330Z" fill="url(#body)"/>
  <path d="M76 250 C98 214 130 194 168 192" fill="none" stroke="#ffffff" stroke-opacity=".35" stroke-width="10" stroke-linecap="round"/>
  <!-- eyes, looking up at the bubble -->
  <ellipse cx="124" cy="310" rx="32" ry="36" fill="#f8fafc"/><ellipse cx="214" cy="310" rx="32" ry="36" fill="#f8fafc"/>
  <circle cx="134" cy="300" r="17" fill="#1e1b4b"/><circle cx="224" cy="300" r="17" fill="#1e1b4b"/>
  <circle cx="140" cy="293" r="6" fill="#fff"/><circle cx="230" cy="293" r="6" fill="#fff"/>
  <!-- smile -->
  <path d="M140 366 Q169 386 198 366" fill="none" stroke="#134e4a" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
